<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=Roboto">    
    <title>Series List</title>
</head>
<body onload="fetch_series_watch_list()">   

  <div class="searchbox">
    <svg viewBox="0 0 24 24">
      <path
       d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
     />
   </svg>
    <input
     id="movieSearch"
     autocomplete="off"
     inputmode="search"
     placeholder="Use search to add series"
     type="search"
    />
  </div>

  <!---Searchbox borrowed from here https://medium.com/100-days-in-kyoto-to-create-a-web-app-with-google/day-17-styling-a-search-box-like-googles-e17dd9074abe-->

  <div class="filters">
    <button onclick="display_all_series()">All</button>
    <button onclick="filter_watched_series()">Watched</button>
    <button onclick="filter_unwatched_series()">Unwatched</button>
  </div>

  <div id="itemCards" class="itemCards"></div>

  <div id="searchResults" class="searchResults">
    <div>
      <div id="resultsHeader" class="resultsHeader">
      </div>
     <div id=resultCards class="resultCards"></div>
    </div>
  </div>

  <nav class="footer">
    <a href="index.html"><img src="assets/home.png" width="42" class="ficon"></a>
    <a href="movielist.html"><img src="assets/movie.png" width="42" class="ficon"></a>
    <a href="serieslist.html"><img src="assets/series.png" width="42" class="ficon"></a>
    <a href="animelist.html"><img src="assets/anime.png" width="42" class="ficon"></a>
  </nav>

  <script>

    let currentSeries; 
    let allSeries;
    let seriesResults;

    let searchModalOpen;

    const searchInput = document.getElementById("movieSearch");

    searchInput.addEventListener('keypress', (event) => {
      if(event.key == 'Enter'){

        seriesResults = allSeries;
        perform_search(searchInput.value);
        searchInput.value = "";
      }
    })

    async function fetch_series_watch_list() {
      //read database and return all series
        const localDisplayURL = "/list/series";

        const response = await fetch(localDisplayURL);
        const data = await response.json();        

        allSeries = data;
        currentSeries = data;
        
        if (  allSeries.length > 0){
          render_series_cards(allSeries);
        }else {
          render_empty_list();
        }
    }

    function render_empty_list(){
      const listarea = document.getElementById("itemCards");
      listarea.innerHTML = `
                            <div class = "emptyList">
                              <span><img src = "assets/sad.png" width = "128"></span>
                              <span>It's kind of lonely here...</span>
                              <span>Use the Search Above to add series to your list and build an awesome collection!</span>
                            </div>
                           `
    }

    function filter_watched_series() {
      let watchedSeries = [];

      for(i=0;i<allSeries.length;i++){
        let serie = allSeries[i];

        if(serie.watched == 1){
          watchedSeries.push(serie);
        }
      }
      
      if (watchedSeries.length > 0){
        render_series_cards(watchedSeries);
      }else{
        render_empty_list();
      }
    } //filter_watched_series

    function filter_unwatched_series() {
      let unwatchedSeries = [];
      console.log(allSeries);
      for(i=0;i<allSeries.length;i++){
        let serie = allSeries[i];

        if(serie.watched == 0){
          unwatchedSeries.push(serie);
        }
      }
      
      console.log(unwatchedSeries.length);
      if (unwatchedSeries.length > 0){
        render_series_cards(unwatchedSeries);
      }else{
        render_empty_list();
      }
    } //filter_unwatched_series    

    function display_all_series(){
      if(allSeries.length > 0){
        render_series_cards(allSeries);
        console.log(allSeries);
      }else{
        render_empty_list();
      }
    }

    function render_series_cards(series) {

      const seriesCards = document.getElementById("itemCards");
      seriesCards.innerHTML = "";

      for(i=0;i<series.length;i++){
        let serie = series[i];

        //Detemine Watched Status Icon
        let watchIcon = serie.watched === 1 ? "assets/watched_ok.png" : "assets/watched.png";
        let watchTxt = serie.watched === 1 ? "Mark Unwatched" : "Mark Watched";        

        const seriesCard = document.createElement("div");
          seriesCard.className = 'itemCard';
          seriesCard.innerHTML = `<div class="poster">
                                   <img src="http://image.tmdb.org/t/p/w92${serie.poster_path}" width="92">
                                 </div>
                                 <div class="movieInfo">
                                   <h3>${serie.name}</h3>
                                   <div class="movieDescription">${serie.overview}</div>
                                   <div class="movie-footer">
                                      <p>Release Date: ${serie.first_air_date}</p>
                                        <div class="btnAdd">
                                          <button type="submit" class="icon-button" id="btnyes-${serie.id}" onclick="toggleWatched(this.id)">
                                             <img src=${watchIcon} width="24">
                                             ${watchTxt}
                                          </button>     
                                          <button type="submit" class="icon-button" id="btnrmv-${serie.id}" onclick="remove_from_list(this.id)">
                                            <img src="assets/remove.png" width="24">
                                            Remove
                                          </button>
                                        </div>                                   
                                   </div>
                                   </div>
                                 `
        seriesCards.appendChild(seriesCard);            
      }
    } //render_series_cards

    async function perform_search(searchTerm) {
      const localSearchURL = `/search/series?${new URLSearchParams({query: searchTerm})}`;

      try {

        const response = await fetch(localSearchURL);
        const data = await response.json();

        //Store results in a global variable
        seriesResults = data;

        const statuses = await Promise.all(
          seriesResults.map(serie => check_if_series_exists(serie.id))
        );

        seriesResults.forEach((serie, index) => {
          serie.existStatus = statuses[index];
        });    

        toggle_results_window();
        render_results_header(searchTerm);
        render_result_cards(seriesResults);

      } catch (error) {
        console.log(error.message);
      }
    }

    function toggle_results_window(){
      const searchResults = document.getElementById("searchResults");
      searchResults.style.display = searchResults.style.display == 'flex' ? 'none' : 'flex';
      document.body.style.overflow = "hidden" //disable background scrolling
      searchModalOpen = true;
    }    

    function render_results_header(searchTerm) {
      const resultsHeader = document.getElementById("resultsHeader");

      resultsHeader.innerHTML = `
                                  <div>
                                    <h2>Search Results</h2>
                                    <span class="searchTerm"><p>for "${searchTerm}"<p></span>
                                  </div>
                                  <div>
                                    <button type="button" class="butx" id="butx" onclick="close_search_results()">
                                      <img src="assets/close_wht.png" width="42" onmouseover="close_btn_hover(this);" onmouseout="close_btn_out(this);">
                                    </button>
                                  </div>
                                `;
    }

    function render_result_cards(series) {

      const resultCards = document.getElementById("resultCards");
      resultCards.innerHTML = ""; //clear search results

      for(i=0;i<series.length;i++){
        let serie = series[i];

        let buttonHTML;
        if(serie.existStatus == true){
          buttonHTML = `<button type="submit" class="icon-button" id=btnadd-${serie.id}">
                          <img src="assets/folder_check.png" width="24">
                          Already in Watchlist 
                        </button>
                       `
        }else{
          buttonHTML = `<button type="submit" class="icon-button" id=btnadd-${ serie.id} onclick="add_to_watchlist(this.id)">
                          <img src="assets/add_to_list.png" width="24">
                          Add to Watchlist
                        </button>
                       `
        }

        const resultCard = document.createElement("div");
        resultCard.className = "resultCard";
        resultCard.innerHTML = `
                                 <div class = "poster">
                                   <img src="http://image.tmdb.org/t/p/w92${serie.poster_path}" width="92">
                                 </div>
                                 <div class="movieInfo">
                                  <h3>${serie.name}</h3>
                                  <div class="movieDescription">${serie.overview}</div>
                                  <div class="movie-footer">
                                    <p>Release Date: ${serie.first_air_date}</p>
                                      <div class="btnAdd">
                                        ${buttonHTML}
                                      </div>
                                  </div>
                                 </div>
                               `
        resultCards.appendChild(resultCard);
      }
    }

    async function check_if_series_exists(seriesID) {
      const localExistsURL = `/exists/series?${new URLSearchParams({id: seriesID})}`;
      const response = await fetch(localExistsURL); 
      const data = await response.json();  
      
      return data.exists;
    }    

    function close_search_results() {
      document.getElementById("searchResults").style.display = "none";
      document.body.style.overflow = "auto";  // Re-enable scrolling
    }
    
    async function toggleWatched(buttonID){

      const idArray = buttonID.split("-");
      let seriesID = idArray[1];

      const localWatchedURL = "/watched/series";          

      const selectedSeries = allSeries.find(({ id }) => id === Number(seriesID));

      const options = {
                        method: 'POST',
                        body: JSON.stringify({id: selectedSeries.id}),
                        headers: {
                        'Content-Type': 'application/json',
                        'accept': 'application/json',
                        }
                      }; 

      const response = await fetch(localWatchedURL, options);
      const data = await response.json();      
      
      let button = document.getElementById(`btnyes-${selectedSeries.id}`);
     
      if (data.status == '1'){
        button.innerHTML = `<img src="assets/watched_ok.png" width="24"> Mark Unwatched`;
        selectedSeries.watched = 1;
      }else {
        button.innerHTML = `<img src="assets/watched.png" width="24"> Mark Watched`;
        selectedSeries.watched = 0;
      }
    } //toggleWatched

    async function remove_from_list(buttonID) {
        const idArray = buttonID.split("-");
        let seriesID = idArray[1];
        
        const localRemoveURL = `/remove/series?${new URLSearchParams({id: seriesID})}`;
        
        if (confirm('Remove series from Watchlist?')){
          const response = await fetch(localRemoveURL);
          const data = await response.json();

          const updatedSeries = allSeries.filter(serie => serie.id !== Number(seriesID));

          allSeries = updatedSeries;
          render_series_cards(allSeries);
        }
    } //remove_from_list

    function close_btn_hover(element){
      element.setAttribute('src', 'assets/close_x.png');
    }

    function close_btn_out(element){
      element.setAttribute('src', 'assets/close_wht.png');
    }

    async function add_to_watchlist(buttonID) {
      const idArray = buttonID.split("-");
      let seriesID = idArray[1];   
      
      const selectedSeries = seriesResults.find(({ id }) => id === Number(seriesID));
      
      try {

        const insertURL = "/insert/series";
        const options = {
              method: 'POST',
              body: JSON.stringify(selectedSeries),
              headers: {
                'Content-Type': 'application/json',
                'accept': 'application/json',
              }
            };
        const response = await fetch(insertURL, options);

        if (response.status == 200){
          let addBtn = document.getElementById(buttonID);
          addBtn.innerHTML = `
                              <button type="submit" class="icon-button" id=btnadd-${buttonID}>
                                <img src="assets/folder_check.png" width="24">
                                Added to Watchlist
                              </button>
                             `
          addBtn.disabled = true;
          selectedSeries.watched = 0; //set status to unwatched so filters work
          allSeries.push(selectedSeries);
          render_series_cards(allSeries);
        }

      } catch (error) {
        console.log(error.message);
      }
    }
    
    document.addEventListener("keydown", function(event) {
      if (event.keyCode == 83) {
        //Only prevent default and focus if the search box is NOT already focused
        if (document.activeElement !== document.getElementById("movieSearch")) {
          event.preventDefault();
          document.getElementById("movieSearch").focus();
        }
       }
    });

    const searchResultsModal = document.getElementById("searchResults");

    searchResultsModal.addEventListener('click', (event)=> {
      if (event.target === searchResultsModal){
        close_search_results();
      }
    });

    document.addEventListener("keydown", function(event) {
      if (event.keyCode == 27){ //escape key pressed
        if (searchModalOpen == true){
          searchModalOpen = false;
          close_search_results();
        }
      }
    });
  </script>
    
</body>
</html>
